name: samsung_iap_flutter_android
description: Android implementation of samsung_iap_flutter, an unofficial Flutter plugin for Samsung In-App Purchase on Galaxy Store. Depend on samsung_iap_flutter instead.
version: 0.1.0
homepage: https://github.com/Studio-Pyro/samsung_iap_flutter
repository: https://github.com/Studio-Pyro/samsung_iap_flutter/tree/main/samsung_iap_flutter_android
issue_tracker: https://github.com/Studio-Pyro/samsung_iap_flutter/issues
topics:
  - in-app-purchase
  - iap
  - samsung
  - galaxy-store

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: samsung_iap_flutter
    platforms:
      android:
        package: dev.studiopyro.samsung_iap_flutter
        pluginClass: SamsungIapFlutterPlugin
        dartPluginClass: SamsungIapFlutterAndroid

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  samsung_iap_flutter_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: 29.0.4
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
