name: samsung_iap_flutter_android
description: Android implementation of the samsung_iap_flutter plugin
version: 0.1.0+1


environment:
  sdk: ^3.13.0

flutter:
  plugin:
    implements: samsung_iap_flutter
    platforms:
      android:
        package: dev.studiopyro.samsung_iap_flutter
        pluginClass: SamsungIapFlutterPlugin
        dartPluginClass: SamsungIapFlutterAndroid

dependencies:
  flutter:
    sdk: flutter
  samsung_iap_flutter_platform_interface:
    path: ../samsung_iap_flutter_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^28.0.0
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
