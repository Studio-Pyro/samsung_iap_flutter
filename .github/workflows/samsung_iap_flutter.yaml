name: samsung_iap_flutter

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/samsung_iap_flutter.yaml"
      - "samsung_iap_flutter/**"
      - "samsung_iap_flutter_android/**"
      - "samsung_iap_flutter_platform_interface/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/samsung_iap_flutter.yaml"
      - "samsung_iap_flutter/**"
      - "samsung_iap_flutter_android/**"
      - "samsung_iap_flutter_platform_interface/**"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.47.5
      working_directory: samsung_iap_flutter

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1
    with:
      # ponytail: 40 is the score before the first publish. Raise it to 160 once the
      # packages this one depends on are on pub.dev and main has the pubspec URLs.
      min_score: 40
      working_directory: samsung_iap_flutter

  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: samsung_iap_flutter/example

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: flutter test integration_test/app_test.dart
          working-directory: samsung_iap_flutter/example
