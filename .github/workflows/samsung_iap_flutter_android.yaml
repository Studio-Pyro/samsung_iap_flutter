name: samsung_iap_flutter_android

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/samsung_iap_flutter_android.yaml"
      - "samsung_iap_flutter_android/**"
      - "samsung_iap_flutter/example/android/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/samsung_iap_flutter_android.yaml"
      - "samsung_iap_flutter_android/**"
      - "samsung_iap_flutter/example/android/**"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.47.5
      working_directory: samsung_iap_flutter_android
      coverage_excludes: "**/*.g.dart"

  kotlin:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: samsung_iap_flutter/example

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5

      - name: Check generated Pigeon code
        working-directory: samsung_iap_flutter_android
        run: |
          flutter pub get
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code

      - name: Generate gradlew and local.properties
        run: flutter build apk --debug --config-only

      - name: Kotlin unit tests
        working-directory: samsung_iap_flutter/example/android
        run: ./gradlew :samsung_iap_flutter_android:testDebugUnitTest
