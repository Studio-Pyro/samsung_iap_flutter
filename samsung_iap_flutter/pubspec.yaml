name: samsung_iap_flutter
description: Unofficial Flutter plugin for Samsung In-App Purchase (IAP) SDK 6.5.2 on Galaxy Store. Products, purchases, consume and acknowledge, subscriptions and plan changes.
version: 0.1.0
homepage: https://github.com/Studio-Pyro/samsung_iap_flutter
repository: https://github.com/Studio-Pyro/samsung_iap_flutter/tree/main/samsung_iap_flutter
issue_tracker: https://github.com/Studio-Pyro/samsung_iap_flutter/issues
topics:
  - in-app-purchase
  - iap
  - samsung
  - galaxy-store

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: samsung_iap_flutter_android

dependencies:
  flutter:
    sdk: flutter
  samsung_iap_flutter_android: ^0.1.0
  samsung_iap_flutter_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
